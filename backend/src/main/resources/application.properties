spring.application.name=backend
server.port=${PORT:8080}

# ---- PostgreSQL ----
# Override with environment variables in any shared or deployed environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knowledgecanvas}
spring.datasource.username=${DB_USERNAME:knowledgecanvas_user}
spring.datasource.password=${DB_PASSWORD:RadhaKrishn}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---- Auth ----
# The ai-service validates the same token, so JWT_SECRET must match ai-service/.env.
app.jwt.secret=${JWT_SECRET:knowledgecanvas_secret_key_123456789}
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
