# PostgreSQL for the Spring backend. Credentials match application.properties defaults.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: knowledgecanvas
      POSTGRES_USER: knowledgecanvas_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-RadhaKrishn}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
